name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # The vault layer is stdlib-only by design, so the tests need nothing but pytest.
      # Installing the package would pull the MCP SDK in for no benefit here.
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      - name: Run tests — vault-mcp
        working-directory: mcp/vault-mcp
        run: pytest tests/ -v

      - name: Run tests — sqlite-mcp
        working-directory: mcp/sqlite-mcp
        run: pytest tests/ -v

      # Fixture tests over Claude Code's transcript format. If these fail, the format moved —
      # which is exactly the signal they exist to give, instead of silently empty digests.
      - name: Run tests — automation
        working-directory: automation
        run: pytest tests/ -v

  portability:
    name: Harvest runs on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python -m pip install --upgrade pip pytest

      # The runner's own unit tests, on every platform. The lock, the atomic cursor write and
      # the state file are the parts whose behaviour is platform-dependent, so running them
      # only on Linux would test the interesting half nowhere.
      - name: Run tests — automation
        working-directory: automation
        run: pytest tests/ -v

      # Every step below uses `shell: python`, not bash. The claim this job exists to check is
      # that the harvest needs no POSIX shell — a step written in bash would quietly rely on
      # the Git Bash that GitHub's Windows image happens to ship, and prove the opposite.
      - name: Dry run is the default, on this platform
        shell: python
        run: |
          import json, os, shutil, subprocess, sys
          from pathlib import Path

          root = Path.cwd()
          state = root / "ci-state"
          projects = root / "ci-projects" / "sample"
          projects.mkdir(parents=True)
          shutil.copy(root / "automation/tests/fixtures/session-unicode.jsonl",
                      projects / "session.jsonl")

          env = {**os.environ, "MINER_STATE_DIR": str(state),
                 "MINER_PROJECTS_DIR": str(root / "ci-projects")}
          run = subprocess.run([sys.executable, "automation/run.py", "--since-days", "100000"],
                               capture_output=True, text=True, encoding="utf-8", env=env)
          print(run.stdout, run.stderr)
          assert run.returncode == 0, f"runner exited {run.returncode}"
          assert "DRY RUN" in run.stdout, "the default is not a dry run"
          assert not (state / "last-run").exists(), "a dry run advanced the cursor"

          digests = list((state / "staging").glob("*.md"))
          assert digests, "no digest was written"
          # The digest must carry the umlaut through, on a platform whose default codec cannot.
          text = digests[0].read_text(encoding="utf-8")
          assert "Europe/Z\u00fcrich" in text, "non-ASCII content did not survive"
          print(f"{len(digests)} digest(s), non-ASCII intact")

      - name: Status reports a failure series and exits non-zero
        shell: python
        run: |
          import json, os, subprocess, sys
          from pathlib import Path

          state = Path.cwd() / "ci-state"
          # A run that never happened must not look healthy: write a failed attempt the way the
          # runner does, then let --status speak for it.
          (state / "state.json").write_text(json.dumps(
              {"status": "auth_failed", "last_attempt": "2024-01-01T00:00:00Z",
               "consecutive_failures": 3, "failing_since": "2024-01-01T00:00:00Z"}),
              encoding="utf-8")
          env = {**os.environ, "MINER_STATE_DIR": str(state)}
          run = subprocess.run([sys.executable, "automation/run.py", "--status"],
                               capture_output=True, text=True, encoding="utf-8", env=env)
          print(run.stdout, run.stderr)
          assert run.returncode == 1, "--status must exit non-zero while runs are failing"
          assert "consecutive failures" in run.stdout
          assert "auth_failed" in run.stdout

      - name: The runner refuses to write without a CLI, and keeps the cursor
        shell: python
        run: |
          import os, subprocess, sys
          from pathlib import Path

          root = Path.cwd()
          state = root / "ci-state-2"
          # MINER_CLI points at nothing on purpose. Forcing this through PATH would be both
          # platform-dependent and dangerous: on a machine that does have the CLI, the step
          # would start a real unattended run with write access.
          env = {**os.environ, "MINER_STATE_DIR": str(state),
                 "MINER_PROJECTS_DIR": str(root / "ci-projects"),
                 "MINER_CLI": str(root / "no-such-cli")}
          run = subprocess.run([sys.executable, "automation/run.py", "--since-days", "100000",
                                "--write"], capture_output=True, text=True, encoding="utf-8",
                               env=env)
          print(run.stdout, run.stderr)
          assert run.returncode == 1, "a missing CLI must fail the run"
          assert "not on PATH" in run.stdout
          assert not (state / "last-run").exists(), "the cursor advanced despite a failure"

  package:
    name: Package builds and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install vault-mcp
        working-directory: mcp/vault-mcp
        run: python -m pip install --upgrade pip .
      - name: Install sqlite-mcp
        working-directory: mcp/sqlite-mcp
        run: python -m pip install .
      # Importing the SERVER modules, not just the packages: a typo in an @mcp.tool() signature
      # or a breaking change in the MCP SDK only shows up here.
      - name: Import check
        env:
          VAULT_PATH: vault-template
        run: |
          python -c "import vault_mcp; print('vault-mcp', vault_mcp.__version__)"
          python -c "import sqlite_mcp; print('sqlite-mcp', sqlite_mcp.__version__)"
          python -c "import vault_mcp.server; print('vault-mcp server ok')"
          SQLITE_MCP_PROFILES="demo=:memory::ro" python -c "import sqlite_mcp.server; print('sqlite-mcp server ok')"

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The repository is authored on a Windows mount, where git sets core.filemode=false
      # and therefore ignores local permission bits. A chmod +x there never reaches the index,
      # and nothing fails locally because the mount reports every file as executable anyway.
      - name: Executable bit is committed
        run: |
          bad=$(git ls-files -s -- '*.sh' | awk '$1 != "100755" { print $4 }')
          if [ -n "$bad" ]; then
            echo "Not executable in git. Fix with: git update-index --chmod=+x <file>"
            echo "$bad"
            exit 1
          fi
          echo "all shell scripts are mode 100755"

      - name: Syntax check
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || fail=1
          done < <(find . -name '*.sh' -print0)
          exit "$fail"

      - name: ShellCheck
        run: |
          shellcheck --version
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck --severity=warning

  docs:
    name: Documentation links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 .github/scripts/check-links.py

  vault:
    name: Vault template is self-consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Uses the same script as `make vault`, so a green local run predicts a green CI run.
      - name: Health check
        run: python3 .github/scripts/check-vault.py

  bootstrap:
    name: Bootstrap runs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Dry run
        run: ./setup/bootstrap.sh --vault /tmp/v --claude-dir /tmp/c --dry-run

      - name: Real run
        run: ./setup/bootstrap.sh --vault /tmp/v --claude-dir /tmp/c

      - name: Verify the result
        run: |
          test -f /tmp/v/HOME.md
          test -x /tmp/c/hooks/memory-recall-reminder.sh
          test -f /tmp/c/CLAUDE.md
          notes=$(find /tmp/v -name '*.md' | wc -l)
          echo "vault notes: $notes"
          test "$notes" -gt 30

      - name: Second run must be idempotent
        run: |
          ./setup/bootstrap.sh --vault /tmp/v --claude-dir /tmp/c | tee out.txt
          grep -q 'skip' out.txt

      # The harvest runner is exercised end to end like bootstrap.sh, against a transcript
      # directory built for the purpose. Its default must stay dry run.
      - name: Harvest runner dry-runs against a synthetic transcript
        run: |
          mkdir -p /tmp/proj/sample
          cp automation/tests/fixtures/session-sample.jsonl /tmp/proj/sample/abc.jsonl
          MINER_STATE_DIR=/tmp/miner MINER_PROJECTS_DIR=/tmp/proj \
            ./automation/run.sh --since-days 100000 2>&1 | tee /tmp/run.out
          grep -q 'DRY RUN' /tmp/run.out || { echo "default is not a dry run"; exit 1; }
          test ! -f /tmp/miner/last-run || { echo "state advanced during a dry run"; exit 1; }

      - name: Collector honours the cut marker
        run: |
          mkdir -p /tmp/proj2/sample
          cp automation/tests/fixtures/session-cut.jsonl /tmp/proj2/sample/cut.jsonl
          python3 automation/collect_sessions.py --out /tmp/dig --projects-dir /tmp/proj2 \
            --since-days 100000
          grep -q 'already handled' /tmp/dig/cut.md
          grep -q 'new work after the cut' /tmp/dig/cut.md
          ! grep -q 'old work' /tmp/dig/cut.md

      - name: Recall hook emits context, and stays silent on acknowledgements
        run: |
          echo '{"prompt":"fix the docker mount"}' | /tmp/c/hooks/memory-recall-reminder.sh | grep -q additionalContext
          test -z "$(echo '{"prompt":"ok"}' | /tmp/c/hooks/memory-recall-reminder.sh)"
