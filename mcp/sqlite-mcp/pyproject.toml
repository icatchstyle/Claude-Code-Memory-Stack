[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sqlite-mcp"
version = "0.1.0"
description = "A minimal MCP server demonstrating guardrails enforced in code"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "sqlite", "guardrails", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Database",
]
dependencies = ["mcp>=1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sqlite-mcp = "sqlite_mcp.server:main"

[project.urls]
Homepage = "https://github.com/icatchstyle/Claude-Code-Memory-Stack"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlite_mcp"]
